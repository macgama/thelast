<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les personnages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --ink: #0b1820; --deep: #10262f; --raise: #173440; --line: #24505e; --sea: #1d5a66;
  --sand: #e9cf98; --mist: #9fb9bd; --torch: #ff8a3d; --danger: #ff5b6b; --safe: #62d6a0;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #0b1820; } }
:root[data-theme="dark"] { --ink: #0b1820; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--ink); color: var(--sand); font-family: var(--body); font-size: 16px; line-height: 1.55; }
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--torch); outline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { padding-inline: clamp(16px, 4vw, 56px); max-width: 1600px; margin: 0 auto; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; padding-block: 12px; }
.logo { font-family: var(--display); font-weight: 700; letter-spacing: .18em; font-size: 19px; text-decoration: none; white-space: nowrap; }
.logo b { color: var(--torch); }
.top nav { margin-left: auto; display: flex; gap: 6px; }
.top nav a { text-decoration: none; color: var(--mist); font-size: 14px; padding: 6px 12px; border-radius: 999px; }
.top nav a:hover, .top nav a[aria-current] { color: var(--sand); background: var(--raise); }

.intro { padding-block: clamp(24px, 4vw, 48px) 14px; }
h1 { font-family: var(--display); font-size: clamp(30px, 4vw, 52px); margin: 0 0 6px; line-height: 1.05; }
h1 em { font-style: normal; color: var(--torch); }
.intro p { color: var(--mist); max-width: 760px; margin: 0 0 18px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--deep); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; color: var(--mist); }
.seg button[aria-pressed="true"] { background: var(--torch); color: var(--ink); }
input[type=search] { flex: 1 1 220px; max-width: 380px; background: var(--deep); border: 1px solid var(--line); color: var(--sand); border-radius: 999px; padding: 9px 16px; font: inherit; font-size: 15px; }
.count { color: var(--mist); font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 190px), 1fr)); gap: 14px; padding-block: 10px 48px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--deep); border-radius: 16px; overflow: hidden; padding: 0; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--torch); transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
.card .ph { position: relative; aspect-ratio: 1; background: #d9d6d2; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ribbon { position: absolute; left: 8px; top: 8px; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--sand); padding: 3px 8px; border-radius: 999px; }
.card .ribbon.star { background: var(--torch); color: var(--ink); }
.card .t { padding: 10px 12px 12px; display: grid; gap: 2px; }
.card .n { font-family: var(--display); font-weight: 700; font-size: 18px; }
.card .n small { font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--mist); margin-left: 6px; }
.card .j { font-size: 13.5px; color: var(--mist); }
.card .q { font-size: 13px; font-style: italic; margin-top: 4px; }

/* fiche détaillée */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(4, 10, 14, .78); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
.box { position: relative; width: min(1180px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--deep); border: 1px solid var(--line); border-radius: 20px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.art { background: #e4e2df; position: relative; display: flex; flex-direction: column; justify-content: center; }
.art img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
.art .seg { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--ink) 85%, transparent); }
.info { padding: clamp(18px, 2.5vw, 32px); display: grid; gap: 14px; align-content: start; }
.info h2 { font-family: var(--display); font-size: clamp(28px, 3vw, 40px); margin: 0; line-height: 1; }
.meta { color: var(--mist); font-size: 15px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badges span { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--mist); }
.badges span.star { border-color: var(--torch); color: var(--torch); }
.quote { font-family: var(--display); font-size: 20px; color: var(--torch); margin: 0; }
.info h3 { font-family: var(--display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--mist); margin: 0 0 4px; }
.info p { margin: 0; }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: 92px 1fr 32px; gap: 10px; align-items: center; font-size: 14px; }
.bar i { height: 8px; border-radius: 4px; background: var(--raise); overflow: hidden; display: block; }
.bar i b { display: block; height: 100%; background: linear-gradient(90deg, var(--torch), #ffc061); border-radius: 4px; }
.bar span:last-child { text-align: right; color: var(--mist); font-variant-numeric: tabular-nums; }
.card .ph .lvl { position: absolute; right: 8px; top: 8px; font: 700 11px var(--display); letter-spacing: .06em; background: color-mix(in srgb, var(--ink) 85%, transparent); color: var(--sand); padding: 3px 8px; border-radius: 999px; }
.card .ph.aura { box-shadow: inset 0 0 0 3px #ffc061, inset 0 0 30px rgba(255, 192, 97, .55); }
.card .ph.aura img { filter: saturate(1.1) brightness(1.04); }
.bar i { display: flex; }
.bar i b.up { background: var(--safe); border-radius: 0 4px 4px 0; }
.bar em { font-style: normal; color: var(--safe); font-size: 12px; margin-left: 3px; }
.bar { grid-template-columns: 92px 1fr 52px; }
.badges span.new { border-color: var(--safe); color: var(--safe); }
.career { background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.career h3 { margin: 0; }
.lv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; }
.lv .big { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--torch); }
.lv i { height: 8px; border-radius: 4px; background: var(--deep); overflow: hidden; display: block; }
.lv i b { display: block; height: 100%; background: var(--torch); }
.lv small { grid-column: 1 / -1; color: var(--mist); font-size: 12.5px; }
.palm { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.palm li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 14px; }
.palm li b { font-family: var(--display); }
.palm li small, .muted { color: var(--mist); font-size: 13px; margin: 0; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.watch.alt { background: var(--raise); color: var(--sand); border: 1px solid var(--line); }
.card .ph .fan { position: absolute; right: 8px; bottom: 8px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--danger); color: #fff; font-size: 14px; }
.legendline { margin: 0; font-size: 13.5px; }
.links h4 { margin: 4px 0 6px; font-family: var(--display); font-size: 14px; }
.links a { display: flex; gap: 10px; align-items: center; text-decoration: none; padding: 4px 0; }
.links img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #d9d6d2; }
.links b { display: block; font-family: var(--display); font-size: 14px; }
.links small { color: var(--mist); font-size: 12px; }
.links a:hover b { color: var(--torch); }
.fanbox { display: grid; gap: 8px; justify-items: start; }
.fanbtn { border: 1px solid var(--danger); background: none; color: var(--danger); border-radius: 999px; padding: 8px 16px; font-family: var(--display); font-weight: 700; }
.fanbtn[aria-pressed="true"] { background: var(--danger); color: #fff; }
.fbadges { display: flex; gap: 6px; flex-wrap: wrap; }
.fbadges span { font-size: 12.5px; border: 1px dashed var(--line); border-radius: 999px; padding: 2px 10px; color: var(--mist); opacity: .7; }
.fbadges span.got { border-style: solid; border-color: var(--torch); color: var(--sand); opacity: 1; }
.close, .nav { position: absolute; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: color-mix(in srgb, var(--ink) 85%, transparent); font-size: 22px; line-height: 1; display: grid; place-items: center; }
.close { top: 12px; right: 12px; }
.nav.prev { top: 12px; left: 12px; }
.nav.next { top: 12px; left: 58px; }
.close:hover, .nav:hover { border-color: var(--torch); }
.watch { justify-self: start; text-decoration: none; font-family: var(--display); font-weight: 700; background: var(--torch); color: var(--ink); border-radius: 999px; padding: 10px 18px; }

@media (max-width: 820px) {
  .sheet { padding: 0; place-items: stretch; }
  .box { grid-template-columns: 1fr; max-height: 100dvh; border-radius: 0; border: 0; }
  .top nav a { padding: 6px 9px; }
}
@media (max-width: 460px) { .logo { font-size: 16px; letter-spacing: .12em; } .top nav a { padding: 6px 7px; font-size: 13px; } .top .wrap, .top { gap: 10px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html">THE <b>LAST</b></a>
    <nav aria-label="Navigation principale">
      <a href="index.html">Accueil</a>
      <a href="personnages.html" aria-current="page">Personnages</a>
      <a href="selection.html">Sélection</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <h1>Les <em>100</em> personnages</h1>
    <p>Chaque semaine, 50 d'entre eux sont tirés au sort pour une nouvelle émission. Touchez un visage pour lire sa fiche et voir sa planche complète, en tenue de naufragé ou en tenue de départ.</p>
    <div class="tools">
      <div class="seg" role="group" aria-label="Filtrer">
        <button type="button" data-f="all" aria-pressed="true">Tous</button>
        <button type="button" data-f="season" aria-pressed="false">Sur l'île</button>
        <button type="button" data-f="featured" aria-pressed="false">À suivre</button>
        <button type="button" data-f="champ" aria-pressed="false">Palmarès</button>
        <button type="button" data-f="fan" aria-pressed="false">Mon fan-club</button>
      </div>
      <input type="search" id="q" placeholder="Chercher un nom, un métier, une ville…" aria-label="Chercher un personnage">
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sName">
  <div class="box" id="box"></div>
</div>

<script src="fanclub.js"></script>
<script>
(async function () {
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const list = await (await fetch("personnages.json")).json();
  const SKILL = { negotiation: "Négociation", firstAid: "Premiers secours", tracking: "Pistage", stealth: "Discrétion", orientation: "Orientation", crafting: "Bricolage", climbing: "Escalade", swimming: "Natation", endurance: "Endurance", foraging: "Cueillette" };
  const FEAR = { solitude: "la solitude", heights: "le vide", water: "l'eau profonde", darkness: "le noir", insects: "les insectes" };
  const TRAIT = [["courage", "Courage"], ["empathy", "Empathie"], ["cunning", "Ruse"], ["loyalty", "Loyauté"], ["composure", "Sang-froid"]];
  const grid = document.getElementById("grid"), FANS = window.TheLastFans;
  const L = Object.fromEntries(list.map((c) => [c.id, c]));
  grid.innerHTML = list.map((c, i) => `<button type="button" class="card" data-i="${i}" data-q="${esc(`${c.name} ${c.job} ${c.origin}`.toLowerCase())}">
    <div class="ph${c.career.cosmetics.some((x) => x.startsWith("aura")) ? " aura" : ""}"><img src="img/p/${c.id}.webp" alt="" loading="lazy" decoding="async"><span class="lvl" title="Niveau ${c.career.level}">${c.career.legend ? "👑 Légende" : `Niv. ${c.career.level}`}</span><span class="fan" ${FANS.isFan(c.id) ? "" : "hidden"} aria-label="Dans ton fan-club">❤</span>${c.featured ? `<span class="ribbon star">À suivre</span>` : c.season ? `<span class="ribbon">Sur l'île</span>` : ""}</div>
    <div class="t"><span class="n">${esc(c.name)}<small>${c.age} ans</small></span><span class="j">${esc(c.job)} · ${esc(c.origin)}</span><span class="q">« ${esc(c.catchphrase)} »</span></div></button>`).join("");

  let filter = "all";
  const apply = () => {
    const q = document.getElementById("q").value.trim().toLowerCase();
    let n = 0;
    for (const el of grid.children) {
      const c = list[el.dataset.i];
      const ok = (filter === "all" || (filter === "champ" ? c.career.titles.length : filter === "fan" ? FANS.isFan(c.id) : c[filter])) && (!q || el.dataset.q.includes(q));
      el.hidden = !ok; n += ok;
    }
    document.getElementById("count").textContent = `${n} personnage${n > 1 ? "s" : ""}`;
  };
  document.querySelectorAll(".tools .seg button").forEach((b) => b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll(".tools .seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    apply();
  }));
  document.getElementById("q").addEventListener("input", apply);
  apply();

  const COSM = { aura_survivor: "Aura dorée de vainqueur de Survivor", frame_survivor: "Cadre de finaliste de Survivor", aura_arena: "Aura de champion d'Arena Battle", frame_arena: "Cadre de finaliste d'Arena Battle" };
  const SEASON = (r) => `${r.show === "survivor" ? "Survivor" : r.show === "arena" ? "Arena Battle" : r.show} · ${r.season === 0 ? "saison pilote" : "saison " + r.season}`;
  function career(c) {
    const k = c.career, from = [0, 40, 100, 180, 280, 400, 540, 700, 880, 1080][k.level - 1];
    const pct = k.next ? Math.round(((k.xp - from) / (k.next - from)) * 100) : 100;
    const res = k.results.map((r) => `<li><span>${SEASON(r)}</span><b>${r.rank === 1 ? "🏆 Vainqueur" : r.rank <= 3 ? `🥈 ${r.rank}e place` : `${r.rank}e sur ${r.of}`}</b>${r.day ? `<small>évacué${c.gender === "f" ? "e" : c.gender === "x" ? "·e" : ""} le jour ${r.day}</small>` : ""}</li>`).join("");
    return `<div class="career"><h3>Carrière</h3>
      <div class="lv"><span class="big">Niveau ${k.level}</span><i><b style="width:${pct}%"></b></i><small>${k.xp} XP${k.next ? ` · niveau suivant à ${k.next}` : " · niveau maximum"}</small></div>
      <p class="muted">${k.played.length ? `Saisons jouées : ${k.played.map((p) => SEASON(p) + (p.done ? "" : " (en cours)")).join(", ")}.` : "Pas encore de saison jouée."}</p>
      ${res ? `<ul class="palm">${res}</ul>` : `<p class="muted">Pas encore d'émission terminée. Sa carrière commence ${c.season ? "avec la saison 1 de Survivor" : "dès sa première sélection"}.</p>`}
      <p class="legendline">${k.legend ? "👑 Légende de The Last : a gagné plusieurs émissions." : `👑 Légende : ${k.wins ? `${k.wins} victoire sur 2. Encore une victoire dans une autre émission pour devenir Légende.` : "gagner deux émissions différentes pour devenir Légende."}`}</p>
      ${links(k.rivals, "Rivaux", "⚡")}${links(k.allies, "Alliés", "🤝")}
      ${k.cosmetics.length ? `<p class="muted">Récompense visuelle : ${k.cosmetics.map((x) => COSM[x] || x).join(", ")}.</p>` : ""}</div>`;
  }

  function links(arr, title, ico) {
    if (!arr?.length) return "";
    return `<div class="links"><h4>${ico} ${title}</h4>${arr.map((x) => `<a href="#${x.id}"><img src="img/p/${x.id}.webp" alt=""><span><b>${esc(L[x.id].name)}</b><small>${esc(x.why.join(", "))} · ${esc(x.where)}</small></span></a>`).join("")}</div>`;
  }
  const ELIG = await fetch("emissions.json").then((r) => r.json()).then((e) => e.eligible).catch(() => ({ retour: [], allstars: [] }));
  function paintFan(c) {
    const on = FANS.isFan(c.id), b = FANS.badges(c), m = FANS.members(c);
    document.getElementById("fanBox").innerHTML = `<div class="fanbox"><button type="button" class="fanbtn" id="fanBtn" aria-pressed="${on}">${on ? "❤ Dans ton fan-club" : "♡ Rejoindre son fan-club"}</button>
      <span class="muted">${m.toLocaleString("fr-FR")} fans · badges gratuits, gagnés en revenant</span>
      ${on ? `<div class="fbadges">${FANS.BADGES.map((x) => `<span class="${b.got.some((g) => g.id === x.id) ? "got" : ""}" title="${esc(x.text)}">${x.icon} ${x.name}</span>`).join("")}</div>${b.next ? `<span class="muted">Prochain badge : ${b.next.icon} ${b.next.name}, encore ${b.next.left} jour${b.next.left > 1 ? "s" : ""} de visite.</span>` : ""}` : ""}</div>`;
    document.getElementById("fanBtn").addEventListener("click", () => {
      FANS.toggle(c.id); paintFan(c);
      grid.querySelector(`[data-i="${list.indexOf(c)}"] .fan`).hidden = !FANS.isFan(c.id);
    });
  }

  // fiche
  const sheet = document.getElementById("sheet"), box = document.getElementById("box");
  let cur = -1, back = null, outfit = "s";
  const visible = () => [...grid.children].filter((el) => !el.hidden).map((el) => +el.dataset.i);
  function open(i) {
    cur = i; const c = list[i];
    box.innerHTML = `<button type="button" class="close" id="sClose" aria-label="Fermer">×</button>
      <button type="button" class="nav prev" id="sPrev" aria-label="Personnage précédent">‹</button><button type="button" class="nav next" id="sNext" aria-label="Personnage suivant">›</button>
      <div class="art"><img id="sImg" src="img/${outfit}/${c.id}.webp" alt="Planche de ${esc(c.name)} : visage, face, profil et dos">
        <div class="seg" role="group" aria-label="Tenue"><button type="button" data-o="s" aria-pressed="${outfit === "s"}">Naufragé${c.gender === "f" ? "e" : c.gender === "x" ? "·e" : ""}</button><button type="button" data-o="b" aria-pressed="${outfit === "b"}">Tenue de départ</button></div></div>
      <div class="info">
        <div><h2 id="sName">${esc(c.name)}</h2><div class="meta">${c.age} ans · ${esc(c.job)} · ${esc(c.origin)}</div></div>
        <div class="badges">${c.featured ? `<span class="star">★ À suivre cette saison</span>` : ""}${c.season ? `<span>Sur l'île · Saison 1</span>` : `<span>En réserve cette semaine</span>`}${c.career.titles.map((t) => `<span class="star">${t.startsWith("Légende") ? "👑" : t.startsWith("Vainqueur") ? "🏆" : "🥈"} ${esc(t)}</span>`).join("")}</div>
        <p class="quote">« ${esc(c.catchphrase)} »</p>
        <div id="fanBox"></div>
        <div><h3>Son histoire</h3><p>${esc(c.bio)}</p></div>
        <div><h3>Sa motivation</h3><p>${esc(c.motivation)}</p></div>
        <div><h3>Caractère</h3><div class="bars">${TRAIT.map(([k, t]) => { const b = c.career.bonus[k] || 0; return `<div class="bar"><span>${t}</span><i><b style="width:${c.traits[k]}%"></b>${b ? `<b class="up" style="width:${b}%"></b>` : ""}</i><span>${c.traits[k] + b}${b ? `<em>+${b}</em>` : ""}</span></div>`; }).join("")}</div></div>
        <div><h3>Atouts</h3><div class="badges">${c.skills.map((s) => `<span>${SKILL[s] || s}</span>`).join("")}${c.career.learned.map((s) => `<span class="new">✨ ${SKILL[s] || s}, appris</span>`).join("")}</div></div>
        ${career(c)}
        <div><h3>Sa grande peur</h3><p>${FEAR[c.phobia] ? FEAR[c.phobia][0].toUpperCase() + FEAR[c.phobia].slice(1) : esc(c.phobia)}. Son secret, lui, se dévoile pendant la saison.</p></div>
        <div class="acts">${c.season ? `<a class="watch" href="survivor.html">▶ Suivre ${esc(c.name)} dans Survivor</a>` : ""}<a class="watch alt" href="selection.html#arena:${c.id}">⚔️ L'envoyer dans Arena Battle</a>${ELIG.allstars.includes(c.id) ? `<a class="watch alt" href="selection.html#allstars:${c.id}">⭐ Voter pour l'All-Stars</a>` : ""}${ELIG.retour.includes(c.id) ? `<a class="watch alt" href="selection.html#retour:${c.id}">🔁 Le repêcher</a>` : ""}</div>
      </div>`;
    paintFan(c);
    box.querySelectorAll(".art .seg button").forEach((b) => b.addEventListener("click", () => {
      outfit = b.dataset.o; document.getElementById("sImg").src = `img/${outfit}/${c.id}.webp`;
      box.querySelectorAll(".art .seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    }));
    document.getElementById("sClose").addEventListener("click", close);
    document.getElementById("sPrev").addEventListener("click", () => step(-1));
    document.getElementById("sNext").addEventListener("click", () => step(1));
    if (sheet.hidden) { back = document.activeElement; sheet.hidden = false; document.body.style.overflow = "hidden"; }
    box.scrollTop = 0;
    document.getElementById("sClose").focus({ preventScroll: true });
    try { history.replaceState(null, "", "#" + c.id); } catch {}
  }
  function step(d) { const v = visible(); if (!v.length) return; const k = v.indexOf(cur); open(v[(k + d + v.length) % v.length]); }
  function close() {
    sheet.hidden = true; document.body.style.overflow = "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    const card = grid.querySelector(`[data-i="${cur}"]`);
    (card || back)?.focus({ preventScroll: true });
  }
  grid.addEventListener("click", (e) => { const b = e.target.closest(".card"); if (b) open(+b.dataset.i); });
  sheet.addEventListener("click", (e) => { if (e.target === sheet) close(); });
  document.addEventListener("keydown", (e) => {
    if (sheet.hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });
  const fromHash = () => { const id = location.hash.slice(1); const i = list.findIndex((c) => c.id === id); if (i >= 0) open(i); };
  fromHash();
  window.addEventListener("hashchange", fromHash);
})();
</script>
</body>
</html>
