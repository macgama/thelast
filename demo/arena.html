<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last · Arena Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concept : un stade de nuit, projecteurs et écrans géants. Un seul thème sombre, assumé, comme un plateau télé.
   L'arène occupe tout l'écran ; le direct et les candidats sont dans un panneau (à droite sur grand écran, en bas sur mobile). */
:root {
  --ink: #0d0f16;
  --deep: #151925;
  --raise: #1d2233;
  --line: #2c3450;
  --text: #f4ead2;
  --mist: #a9b0c6;
  --gold: #ffd166;
  --torch: #ff8a3d;
  --danger: #ff5b6b;
  --safe: #62d6a0;
  --pink: #ff4fb8;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: .04em; }

.app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-left)); padding-top: max(10px, env(safe-area-inset-top)); background: var(--deep); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 3; }
.logo { font-family: var(--display); font-weight: 700; letter-spacing: .16em; font-size: 17px; white-space: nowrap; }
.logo b { color: var(--gold); }
.clock { font-family: var(--display); font-weight: 600; font-size: 15px; padding: 4px 10px; border-radius: 8px; background: var(--raise); white-space: nowrap; }
.count { color: var(--mist); font-size: 14px; white-space: nowrap; }
.count b { color: var(--text); font-family: var(--display); font-size: 16px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .12em; color: var(--danger); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.spacer { flex: 1; }
.ctrl { display: flex; gap: 4px; background: var(--raise); padding: 3px; border-radius: 10px; }
.ctrl button { min-width: 40px; height: 34px; border-radius: 8px; font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--mist); }
.ctrl button[aria-pressed="true"] { background: var(--gold); color: #1a1406; }
.icon-btn { height: 40px; min-width: 40px; border-radius: 10px; background: var(--raise); font-family: var(--display); font-weight: 600; }

.stage { position: relative; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.a3-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.a3-tag { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(13, 15, 22, .78); white-space: nowrap; }
.a3-tag.is-me { background: var(--gold); color: #1a1406; }
.a3-pop { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 700; font-size: 22px; white-space: nowrap; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.6); animation: popin .25s ease-out; }
.a3-pop.is-hit { color: var(--gold); font-size: 28px; }
.a3-pop.is-betray { color: var(--danger); font-size: 30px; }
.a3-pop.is-ko { color: var(--danger); font-size: 26px; }
.a3-pop.is-stars { color: var(--gold); font-size: 18px; letter-spacing: .1em; }
.a3-pop.is-item, .a3-pop.is-gift { font-size: 26px; }
.a3-pop.is-gift { color: var(--safe); }
.a3-pop.is-trap { color: var(--danger); font-size: 30px; }
.a3-pop.is-warn { color: var(--torch); font-size: 24px; }
.a3-place { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .04em; padding: 1px 7px; border-radius: 6px; background: rgba(13, 15, 22, .55); color: var(--mist); white-space: nowrap; }
.a3-place.is-hot { background: rgba(120, 20, 32, .8); color: #ffd9dd; }
.a3-trap { position: absolute; left: 0; top: 0; font-size: 16px; color: var(--danger); text-shadow: 0 1px 0 #000; animation: blink 1s infinite; }
@keyframes popin { from { scale: .3; } to { scale: 1; } }

.banner { position: absolute; left: 50%; top: 16px; translate: -50% 0; max-width: min(640px, calc(100% - 32px)); padding: 10px 16px; border-radius: 12px; background: rgba(13, 15, 22, .86); border: 1px solid var(--line); font-size: 14px; text-align: center; pointer-events: none; transition: opacity .3s; }
.banner b { font-family: var(--display); color: var(--gold); }
.alert { position: absolute; left: 50%; bottom: 64px; translate: -50% 0; width: min(520px, calc(100% - 32px)); display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px 10px 16px; border-radius: 14px; background: rgba(60, 10, 18, .92); border: 1px solid var(--danger); font-size: 14px; z-index: 2; animation: slidein .3s ease-out; }
.alert b { font-family: var(--display); color: #ffc2c8; letter-spacing: .06em; display: block; font-size: 12px; }
.alert .btn { background: var(--danger); color: #1a0406; white-space: nowrap; }
.cam { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 4px; background: rgba(13, 15, 22, .86); padding: 3px; border-radius: 10px; }
.cam button { padding: 0 12px; height: 34px; border-radius: 8px; font-size: 13px; color: var(--mist); }
.cam button[aria-pressed="true"] { background: var(--raise); color: var(--text); }

/* Panneau */
.side { background: var(--deep); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.fav { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.fav img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--raise); }
.fav h3 { font-size: 17px; }
.fav .meta { color: var(--mist); font-size: 13px; }
.stars { color: var(--gold); letter-spacing: .12em; font-size: 15px; }
.state { font-size: 12px; font-family: var(--display); font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--raise); }
.state.cage { background: color-mix(in srgb, var(--danger) 25%, transparent); color: #ffc2c8; }
.state.out { background: #2a2a2a; color: var(--mist); }
.state.win { background: var(--gold); color: #1a1406; }
.fav .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 40px; padding: 0 14px; border-radius: 10px; background: var(--raise); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--gold); color: #1a1406; }
.btn:disabled { opacity: .45; cursor: default; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; height: 44px; font-family: var(--display); font-weight: 600; color: var(--mist); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--gold); }
.pane { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 16px 24px; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 8px; }
.feed li { padding: 8px 10px; border-radius: 10px; background: var(--raise); font-size: 14px; animation: slidein .3s ease-out; }
.feed li .when { color: var(--mist); font-size: 12px; font-family: var(--display); margin-right: 6px; }
.feed li.hot { border-left: 3px solid var(--danger); }
.feed li.good { border-left: 3px solid var(--safe); }
.feed li.gold { border-left: 3px solid var(--gold); }
.feed li .voice { display: block; margin-top: 4px; color: var(--mist); font-style: italic; font-size: 13px; }
.feed li .voice b { font-style: normal; color: var(--torch); font-family: var(--display); }
@keyframes slidein { from { opacity: 0; translate: 0 -6px; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.cand { position: relative; text-align: center; font-size: 12px; padding: 4px; border-radius: 10px; }
.cand img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--raise); display: block; }
.cand .n { font-weight: 600; display: block; margin-top: 2px; }
.cand .s { color: var(--gold); font-size: 11px; letter-spacing: .08em; }
.cand.is-cage img { outline: 2px solid var(--danger); }
.cand.is-out { opacity: .38; }
.cand.is-out img { filter: grayscale(1); }
.cand.is-me { background: color-mix(in srgb, var(--gold) 18%, transparent); }
.cand .rk { position: absolute; top: 8px; left: 8px; font-family: var(--display); font-size: 11px; background: rgba(0,0,0,.7); padding: 0 5px; border-radius: 5px; }

.zone h4 { font-family: var(--display); font-size: 13px; letter-spacing: .1em; color: var(--gold); margin: 14px 0 6px; }
.zone ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.zone li { padding: 8px 10px; border-radius: 10px; background: var(--raise); font-size: 13px; }
.zone li.mine { outline: 2px solid var(--danger); }
.zone li .k { color: var(--mist); font-size: 12px; display: block; }
.zone .empty { color: var(--mist); font-size: 13px; }
.arenas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 8px; }
.arena { text-align: left; padding: 12px; border-radius: 14px; background: var(--raise); border: 2px solid transparent; display: flex; flex-direction: column; gap: 6px; }
.arena[aria-pressed="true"] { border-color: var(--gold); }
.arena .sw { height: 46px; border-radius: 10px; position: relative; overflow: hidden; }
.arena .sw i { position: absolute; bottom: 0; height: 60%; width: 18%; border-radius: 6px 6px 0 0; }
.arena h3 { font-size: 16px; }
.arena .pitch { color: var(--mist); font-size: 12px; }
.arena .places { display: flex; flex-wrap: wrap; gap: 4px; }
.arena .places span { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--deep); }
.arena .tr { font-size: 11px; color: #ffc2c8; }
.step { font-family: var(--display); color: var(--mist); font-size: 13px; letter-spacing: .1em; margin: 16px 0 8px; }
/* Écrans par-dessus (casting, votes, fin) */
.over { position: fixed; inset: 0; z-index: 10; background: rgba(8, 9, 14, .86); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px 16px; overflow-y: auto; }
.card { width: min(860px, 100%); background: var(--deep); border: 1px solid var(--line); border-radius: 18px; padding: 24px; max-height: 100%; overflow-y: auto; }
.card h2 { font-size: clamp(24px, 4vw, 34px); }
.card .kicker { font-family: var(--display); color: var(--gold); letter-spacing: .14em; font-size: 13px; font-weight: 600; }
.card p { color: var(--mist); margin: 8px 0 16px; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--mist); margin-bottom: 10px; }
.badge { font-family: var(--display); font-size: 10px; font-weight: 600; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; position: absolute; bottom: 30px; left: 50%; translate: -50% 0; white-space: nowrap; }
.badge.pub { background: var(--torch); color: #1a1406; }
.badge.prod { background: #7fb0ff; color: #0b1428; }
.legend .badge { position: static; translate: none; }
.pick .cand { cursor: pointer; }
.pick .cand[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 30%, transparent); }
.duels { display: grid; gap: 10px; }
.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: var(--raise); text-align: center; border: 2px solid transparent; }
.duel:hover { border-color: var(--gold); }
.duel img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; display: block; margin: 0 auto 4px; }
.duel .vs { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 20px; }
.duel .why { grid-column: 1 / -1; font-size: 12px; color: var(--mist); }
.votes { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.vote { padding: 10px; border-radius: 14px; background: var(--raise); text-align: center; border: 2px solid transparent; }
.vote:hover { border-color: var(--safe); }
.vote img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 6px; }
.vote .q { font-size: 12px; color: var(--mist); display: block; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--safe); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; text-align: center; margin: 12px 0; }
.podium img { width: 100%; max-width: 140px; aspect-ratio: 1; border-radius: 14px; object-fit: cover; }
.podium .p1 img { outline: 3px solid var(--gold); }
.podium .pl { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--gold); }
.timer { font-family: var(--display); color: var(--mist); font-size: 13px; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 44vh; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .fav { grid-template-columns: 48px 1fr; padding: 10px 16px; }
  .fav img { width: 48px; height: 48px; }
  .count .lbl, .live { display: none; }
  .top { gap: 6px; }
  .logo { font-size: 13px; letter-spacing: .1em; flex-basis: 100%; }
  .ctrl button { min-width: 34px; }
  .icon-btn { height: 40px; min-width: 38px; }
  .card { padding: 18px; }
  .cam { bottom: 10px; left: 10px; }
}
</style>

<div class="app">
  <header class="top">
    <span class="logo">THE LAST · <b>ARENA BATTLE</b></span>
    <span class="live" data-i18n>EN DIRECT</span>
    <span class="clock" id="clock">J1 · 08h</span>
    <span class="count" id="arenaName"></span>
    <span class="count"><b id="alive">30</b> <span class="lbl" data-i18n>en lice</span></span>
    <span class="spacer"></span>
    <div class="ctrl" role="group" aria-label="Vitesse" data-i18n-attr="aria-label">
      <button id="pause" aria-pressed="false" title="Pause" data-i18n-attr="title,aria-label" aria-label="Pause">❚❚</button>
      <button data-speed="1" aria-pressed="true">×1</button>
      <button data-speed="3" aria-pressed="false">×3</button>
      <button data-speed="8" aria-pressed="false">×8</button>
    </div>
    <button class="icon-btn" id="sound" title="Son" aria-label="Son" data-i18n-attr="title,aria-label">🔊</button>
    <button class="icon-btn" data-lang-switch></button>
  </header>

  <main class="stage">
    <canvas id="c"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="alert" id="alert" hidden></div>
    <div class="cam" role="group" aria-label="Caméra" data-i18n-attr="aria-label">
      <button data-cam="director" aria-pressed="true" data-i18n>Réalisateur</button>
      <button data-cam="follow" aria-pressed="false" data-i18n>Mon favori</button>
      <button data-cam="wide" aria-pressed="false" data-i18n>Vue large</button>
    </div>
  </main>

  <aside class="side">
    <div class="fav" id="fav"></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="feed" data-i18n>Le direct</button>
      <button role="tab" aria-selected="false" data-tab="zone" data-i18n>Pièges & dangers</button>
      <button role="tab" aria-selected="false" data-tab="cast" data-i18n>Les 30</button>
    </div>
    <div class="pane" id="paneFeed"><ol class="feed" id="feed"></ol></div>
    <div class="pane zone" id="paneZone" hidden></div>
    <div class="pane" id="paneCast" hidden><div class="grid" id="grid"></div></div>
  </aside>
</div>

<div class="over" id="over" hidden><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="i18n.js"></script>
<script src="i18n-en-arena.js"></script>
<script src="sound.js"></script>
<script src="avatar.js"></script>
<script src="arenas.js"></script>
<script src="arena-engine.js"></script>
<script src="arena3d.js"></script>
<script>
(async function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const L = I18N.lang;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const pic = (id) => `img/p/${id}.webp`;
  const params = new URLSearchParams(location.search);
  const seed = Number(params.get("graine")) || 7;
  let arenaId = ARENAS[params.get("arene")] ? params.get("arene") : ARENA_LIST[(seed - 1) % ARENA_LIST.length];

  // le vivier : fiches (carrière) + fiches visuelles (modèle 3D)
  const [pool, looks] = await Promise.all([fetch("personnages.json").then((r) => r.json()), fetch("casting.json").then((r) => r.json())]);
  const lookOf = Object.fromEntries(looks.map((c) => [c.id, c.look]));
  const cast = ArenaEngine.cast(pool.map((c) => ({ ...c, look: lookOf[c.id] })), seed);
  let game = null, world = null, A = null;
  const info = Object.fromEntries(cast.map((c) => [c.id, c]));
  const nameOf = (id) => info[id]?.name || id;
  const field = (c, k) => (L === "en" && c.en?.[k]) || c[k];

  const Snd = window.TheLastSound;
  function start(id) {
    arenaId = id; A = ARENAS[id];
    game = ArenaEngine.create(cast, seed, id);
    world = Arena3D.init($("#c"), cast, A, {
      sfx: (n) => Snd?.sfx(n),
      onPick: (cid) => openCand(cid),
    });
    world.setScreen("ARENA BATTLE", A.name);
    world.restore(game.snapshot());
    world.setHour(1, 8);
    $("#arenaName").textContent = A.name;
  }

  // ---------- état de l'interface ----------
  let me = null, speed = 1, paused = false, dropDay = 0, warnDay = 0;
  const day = () => game.state.day;

  // ---------- les commentateurs ----------
  const VOICES = {
    hit: [t("Aïe, ça va laisser des étoiles !"), t("Quel coup ! Le public est debout !"), t("Ça, c'est du grand spectacle."), t("On n'avait jamais vu ça dans cette arène !")],
    ko: [t("Et c'est la Cage ! Il faudra compter sur le public ce soir."), t("Hors jeu ! Le drone arrive déjà."), t("Une étoile de trop… direction la Cage du sursis.")],
    betray: [t("Je n'en reviens pas. Trahi·e par son allié·e !"), t("Voilà pourquoi on ne fait confiance à personne dans l'arène.")],
    out: [t("Au revoir, et merci pour le spectacle."), t("Le drone l'emmène loin de l'arène. Fin de l'aventure.")],
    ally: [t("Une alliance… pour combien de temps ?"), t("Ensemble, ils sont plus forts. En théorie.")],
    trap: [t("Il ne l'a pas vu venir. Personne ne regarde jamais par terre !"), t("Le piège a fonctionné à la perfection. Diabolique… et hilarant."), t("Le public l'avait vu, lui ! On l'a crié pendant une heure !")],
    hazard: [t("L'arène elle-même s'en mêle !"), t("Il fallait se cacher. On l'avait annoncé !")],
    heed: [t("Le public lui a sauvé la mise !"), t("Bien joué, les spectateurs !")],
    win: [t("Quelle saison ! Quel champion !"), t("L'arène a trouvé son champion.")],
  };
  const CASTERS = ["Rex", "Nova"];
  let castTurn = 0;
  function voice(type) {
    const L2 = VOICES[type];
    if (!L2 || Math.random() < 0.35) return "";
    castTurn++;
    return `<span class="voice"><b>${CASTERS[castTurn % 2]}</b> · ${esc(L2[Math.floor(Math.random() * L2.length)])}</span>`;
  }
  const hh = (h) => (L === "en" ? `${h % 12 || 12} ${h < 12 ? "AM" : "PM"}` : String(h).padStart(2, "0") + "h");
  function log(e) {
    if (e.type === "danger" && e.quiet && e.v !== me) return;
    const cls = { hit: e.kind === "betray" ? "hot" : "", ko: "hot", out: "hot", vote: "good", drop: "good", win: "gold", finale: "gold", zone: "hot", duelStart: "gold", danger: "hot", trapSet: "hot", hazardSoon: "hot", hazard: "hot", heed: "good" }[e.type] || "";
    const li = document.createElement("li");
    li.className = cls;
    li.innerHTML = `<span class="when">${t("J{d}", { d: e.day })} · ${hh(e.hour)}</span>${esc(e.text)}${voice(e.kind === "betray" ? "betray" : e.kind === "trap" ? "trap" : e.kind === "hazard" ? "hazard" : e.type)}`;
    $("#feed").appendChild(li);
    while ($("#feed").children.length > 120) $("#feed").firstChild.remove();
    if (me && (e.a === me || e.v === me) && e.type !== "night") banner(e.text);
  }
  let bannerT = 0;
  function banner(text) {
    const b = $("#banner"); b.innerHTML = esc(text); b.hidden = false;
    clearTimeout(bannerT); bannerT = setTimeout(() => (b.hidden = true), 4500);
  }

  // ---------- panneau ----------
  const stateLabel = (c) => c.id === game.state.winner ? `<span class="state win">${t("Vainqueur")}</span>` : c.state === "cage" ? `<span class="state cage">${t("Dans la Cage")}</span>` : c.state === "out" ? `<span class="state out">${t("Évacué·e · {n}e", { n: c.rank })}</span>` : "";
  const starStr = (n) => "★".repeat(n) + "☆".repeat(Math.max(0, 3 - n));
  function renderSide() {
    if (!game) return;
    renderZone(); renderAlert();
    const snap = game.snapshot();
    $("#alive").textContent = snap.cast.filter((c) => c.state !== "out").length;
    $("#clock").textContent = `${t("J{d}", { d: snap.day })} · ${hh(snap.hour)}`;
    $("#grid").innerHTML = snap.cast.map((c) => `<button class="cand ${c.state === "cage" ? "is-cage" : c.state === "out" ? "is-out" : ""} ${c.id === me ? "is-me" : ""}" data-id="${c.id}">
      ${c.state === "out" ? `<span class="rk">${c.rank}e</span>` : ""}<img src="${pic(c.id)}" alt="" loading="lazy"><span class="n">${esc(c.name)}</span><span class="s">${c.state === "out" ? "" : starStr(c.stars)}</span></button>`).join("");
    const f = $("#fav");
    if (!me) { f.innerHTML = `<div style="grid-column:1/-1;color:var(--mist);font-size:14px">${t("Choisis un favori dans « Les 30 » ou en touchant un candidat dans l'arène.")}</div>`; return; }
    const c = snap.cast.find((x) => x.id === me), ci = info[me];
    const ally = c.ally ? t("Allié·e : {a}", { a: nameOf(c.ally) }) : t("Sans alliance");
    const canDrop = c.state === "in" && dropDay !== snap.day && !snap.over;
    f.innerHTML = `<img src="${pic(me)}" alt="">
      <div><h3>${esc(ci.name)} <span class="stars">${c.state === "out" ? "" : starStr(c.stars)}</span></h3>
      <div class="meta">${esc(field(ci, "job"))} · ${ci.age} ${t("ans")} ${c.shield ? "· 🛡️" : ""}</div>
      <div class="meta">${ally} · ${t("{n} coups portés", { n: c.stats.hits })} ${stateLabel(c)}</div></div>
      <div class="actions"><button class="btn primary" id="dropBtn" ${canDrop ? "" : "disabled"}>${dropDay === snap.day ? t("Caisse envoyée aujourd'hui") : t("🪂 Parachuter une caisse")}</button>
      <button class="btn" id="seeBtn">${t("Voir dans l'arène")}</button></div>`;
    $("#dropBtn").onclick = openDrop;
    $("#seeBtn").onclick = () => { setCam("follow"); world.focusOn(me); };
  }
  const KIND_ICON = { loot: "🎁", hide: "🫥", danger: "⚠️", open: "🌿" };
  function renderZone() {
    const snap = game.snapshot();
    const mine = me && snap.cast.find((c) => c.id === me);
    const placeName = (id) => A.places.find((p) => p.id === id)?.name || id;
    const traps = snap.traps.map((tp) => {
      const visitors = snap.cast.filter((c) => c.state === "in" && c.intent === tp.place && c.place !== tp.place && c.id !== tp.owner).map((c) => c.name);
      const isMine = mine && mine.state === "in" && mine.intent === tp.place && mine.place !== tp.place && tp.owner !== me;
      return `<li class="${isMine ? "mine" : ""}">⚠ ${esc(tp.name)} · <b>${esc(placeName(tp.place))}</b><span class="k">${t("Posé par {a}", { a: esc(nameOf(tp.owner)) })}${visitors.length ? " · " + t("En route : {n}", { n: esc(visitors.slice(0, 4).join(", ")) }) : ""}</span></li>`;
    }).join("");
    const hz = snap.hazards.sort((a, b) => a.hour - b.hour).map((h) => `<li>⏱ ${hh(h.hour)} · ${esc(h.name)}<span class="k">${esc(placeName(h.place))}</span></li>`).join("");
    const places = A.places.map((p) => {
      const n = snap.cast.filter((c) => c.state === "in" && c.place === p.id).length;
      const closed = snap.closed.includes(p.id);
      const fav = mine && mine.state === "in" && mine.place === p.id ? " ⭐" : "";
      return `<li>${KIND_ICON[p.kind]} <b>${esc(p.name)}</b>${fav}<span class="k">${closed ? t("Fermé par la brume") : t("{n} candidat(s) ici", { n })}</span></li>`;
    }).join("");
    $("#paneZone").innerHTML = `<h4>${t("PIÈGES POSÉS")}</h4>${traps ? `<ul>${traps}</ul>` : `<p class="empty">${t("Aucun piège pour l'instant. Ça ne va pas durer.")}</p>`}
      <h4>${t("DANGERS ANNONCÉS AUJOURD'HUI")}</h4>${hz ? `<ul>${hz}</ul>` : `<p class="empty">${t("Plus aucun danger prévu aujourd'hui.")}</p>`}
      <h4>${esc(A.name.toUpperCase())}</h4><ul>${places}</ul>
      <p class="empty">${t("🎁 caisses · 🫥 cachettes · ⚠️ terrain piégeux · 🌿 terrain dégagé. Les candidats ne voient pas les pièges des autres : toi, si.")}</p>`;
  }
  function renderAlert() {
    const el = $("#alert");
    const tp = me && !game.state.over ? game.trapAhead(me) : null;
    if (!tp) { el.hidden = true; return; }
    const can = warnDay !== day();
    el.innerHTML = `<div><b>${t("ATTENTION")}</b>${t("{v} part vers {l}, où {a} a caché {p} !", { v: esc(nameOf(me)), l: esc(tp.placeName), a: esc(tp.ownerName), p: esc(tp.name) })}</div>
      <button class="btn" id="warnBtn" ${can ? "" : "disabled"}>${can ? t("📣 Prévenir") : t("Déjà prévenu·e")}</button>`;
    el.hidden = false;
    $("#warnBtn").onclick = () => {
      game.warn(me); warnDay = day();
      Snd?.sfx("alert");
      banner(t("Le public crie pour prévenir {a}… Va-t-il·elle écouter ?", { a: nameOf(me) }));
      renderAlert();
    };
  }
  $("#grid").addEventListener("click", (e) => { const b = e.target.closest("[data-id]"); if (b) openCand(b.dataset.id); });
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
    document.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === b));
    $("#paneFeed").hidden = b.dataset.tab !== "feed"; $("#paneCast").hidden = b.dataset.tab !== "cast"; $("#paneZone").hidden = b.dataset.tab !== "zone";
  });

  // ---------- fenêtres ----------
  let resume = null;
  function showCard(html, keepRunning = false) {
    $("#card").innerHTML = html; $("#over").hidden = false;
    if (!keepRunning) world?.setPaused(true);
  }
  function closeCard() { $("#over").hidden = true; world?.setPaused(paused); }

  function openCand(id) {
    const ci = info[id], c = game ? game.snapshot().cast.find((x) => x.id === id) : { state: "in", stars: 3 };
    const rivals = (ci.career?.rivals || []).slice(0, 3).map((r) => `${esc(nameOf(r.id) === r.id ? (pool.find((p) => p.id === r.id)?.name || r.id) : nameOf(r.id))} (${esc(r.where)})`).join(", ");
    showCard(`<div class="kicker">${ci.pick === "public" ? t("CHOISI·E PAR LE PUBLIC") : t("REPÊCHÉ·E PAR LA PRODUCTION")}</div>
      <div style="display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start;margin-top:8px">
        <img src="${pic(id)}" alt="" style="width:120px;border-radius:14px">
        <div><h2>${esc(ci.name)} <span class="stars">${c.state === "out" ? "" : starStr(c.stars)}</span></h2>
        <p style="margin:4px 0">${esc(field(ci, "job"))} · ${ci.age} ${t("ans")} · ${esc(field(ci, "origin"))}</p>
        <p style="margin:4px 0;color:var(--text)">« ${esc(field(ci, "catchphrase"))} »</p>
        <p style="margin:4px 0">${esc(field(ci, "bio"))}</p>
        ${rivals ? `<p style="margin:4px 0">${t("Comptes à régler : {r}", { r: rivals })}</p>` : ""}
        <p style="margin:4px 0">${t("Carrière : niveau {l}, {w} victoire(s)", { l: ci.career?.level ?? 1, w: ci.career?.wins ?? 0 })} ${stateLabel(c)}</p></div>
      </div>
      <div class="row"><button class="btn primary" id="mkFav">${me === id ? t("C'est ton favori") : t("En faire mon favori")}</button><button class="btn" id="closeC">${t("Fermer")}</button></div>`);
    $("#mkFav").onclick = () => { setFav(id); closeCard(); };
    $("#closeC").onclick = closeCard;
  }
  function setFav(id) { me = id; world?.setFavorite(id); renderSide(); }

  function openDrop() {
    showCard(`<div class="kicker">${t("CAISSE DU PUBLIC")}</div><h2>${t("Que veux-tu envoyer à {a} ?", { a: esc(nameOf(me)) })}</h2>
      <p>${t("Une caisse par jour, payée avec la monnaie gratuite. Elle tombe à la prochaine heure de jeu.")}</p>
      <div class="duels">
        <button class="btn" data-item="star">⭐ ${t("Une étoile de Garde (+1, maximum 3)")}</button>
        <button class="btn" data-item="shield">🛡️ ${t("Un bouclier en mousse (bloque une attaque)")}</button>
        <button class="btn" data-item="map">🗺️ ${t("La carte des pièges (évite tous les pièges posés aujourd'hui)")}</button>
      </div><div class="row"><button class="btn" id="closeC">${t("Annuler")}</button></div>`);
    $("#card").querySelectorAll("[data-item]").forEach((b) => b.onclick = () => { game.drop(me, b.dataset.item); dropDay = day(); closeCard(); renderSide(); banner(t("Caisse en route pour {a} !", { a: nameOf(me) })); });
    $("#closeC").onclick = closeCard;
  }

  // casting d'ouverture : d'abord l'arène, puis le favori
  const sw = (n) => "#" + n.toString(16).padStart(6, "0");
  function arenaCard(id) {
    const a = ARENAS[id], pal = a.palette;
    return `<button class="arena" data-arena="${id}" aria-pressed="${id === arenaId}">
      <span class="sw" style="background:linear-gradient(180deg, ${sw(pal.sky)}, ${sw(pal.ground)})">${[pal.ground2, pal.accent, pal.fog, pal.ground2].map((c, i) => `<i style="left:${8 + i * 22}%;background:${sw(c)};height:${40 + ((i * 37) % 45)}%"></i>`).join("")}</span>
      <h3>${esc(a.name)}</h3><span class="pitch">${esc(a.pitch)}</span>
      <span class="places">${a.places.map((p) => `<span>${KIND_ICON[p.kind]} ${esc(p.name)}</span>`).join("")}</span>
      <span class="tr">${t("Pièges : {p}", { p: esc(a.traps.map((x) => x.name).join(", ")) })}</span>
      <span class="tr">${t("Dangers : {p}", { p: esc(a.hazards.map((x) => x.name).join(", ")) })}</span></button>`;
  }
  function openCasting() {
    return new Promise((res) => {
      let pick = null;
      showCard(`<div class="kicker">${t("SAISON 1 · ARENA BATTLE")}</div>
        <h2>${t("30 candidats. Une arène. Un seul restera debout.")}</h2>
        <p>${t("Chaque candidat a une Garde de 3 étoiles. Chaque coup, piège ou danger en coûte une. À zéro, un drone l'emporte dans la Cage du sursis, et ton vote de 19h peut le sauver. Personne n'est blessé : tout se joue en mousse, en peinture et en fou rire.")}</p>
        <div class="step">${t("1 · CHOISIS L'ARÈNE DE LA SAISON")}</div>
        <div class="arenas">${ARENA_LIST.map(arenaCard).join("")}</div>
        <div class="step">${t("2 · CHOISIS TON FAVORI")}</div>
        <div class="legend"><span><span class="badge pub">${t("PUBLIC")}</span> ${t("24 choisis par les spectateurs")}</span><span><span class="badge prod">${t("PROD")}</span> ${t("6 repêchés par la production")}</span></div>
        <div class="grid pick">${cast.map((c) => `<button class="cand" data-id="${c.id}" aria-pressed="false"><img src="${pic(c.id)}" alt=""><span class="badge ${c.pick === "public" ? "pub" : "prod"}">${c.pick === "public" ? t("PUBLIC") : t("PROD")}</span><span class="n">${esc(c.name)}</span></button>`).join("")}</div>
        <div class="row"><button class="btn primary" id="go"></button><span class="timer">${t("Touche un visage pour choisir ton favori.")}</span></div>`);
      const label = () => { $("#go").textContent = pick ? t("Entrer dans {l} avec {a}", { l: ARENAS[arenaId].name, a: nameOf(pick) }) : t("Entrer dans {l} sans favori", { l: ARENAS[arenaId].name }); };
      label();
      $("#card").querySelector(".arenas").onclick = (e) => {
        const b = e.target.closest("[data-arena]"); if (!b) return;
        arenaId = b.dataset.arena;
        $("#card").querySelectorAll("[data-arena]").forEach((x) => x.setAttribute("aria-pressed", x === b));
        label();
      };
      $("#card").querySelector(".pick").onclick = (e) => {
        const b = e.target.closest("[data-id]"); if (!b) return;
        pick = b.dataset.id;
        $("#card").querySelectorAll(".pick [data-id]").forEach((x) => x.setAttribute("aria-pressed", x === b));
        label();
      };
      $("#go").onclick = () => {
        Snd?.start(); Snd?.music("challenge");
        start(arenaId);
        const u = new URL(location.href); u.searchParams.set("arene", arenaId); history.replaceState(null, "", u);
        if (pick) setFav(pick);
        closeCard(); res();
      };
    });
  }

  function askDuel(ask) {
    return new Promise((res) => {
      let left = 20;
      showCard(`<div class="kicker">${t("18H · LE DUEL DU SOIR")}</div><h2>${t("Quel duel veux-tu voir ?")}</h2>
        <p>${t("Le perdant perd une étoile. Dans cette maquette, ton choix représente celui du public.")}</p>
        <div class="duels">${ask.options.map((o, i) => `<button class="duel" data-i="${i}">
          <div><img src="${pic(o.a)}" alt="">${esc(nameOf(o.a))}</div><span class="vs">VS</span><div><img src="${pic(o.b)}" alt="">${esc(nameOf(o.b))}</div>
          <span class="why">${o.why === "rival" ? t("Ils ont un compte à régler depuis une autre émission") : t("Proposé par le public")}</span></button>`).join("")}</div>
        <div class="row"><span class="timer" id="tm"></span></div>`);
      const tick = () => { $("#tm") && ($("#tm").textContent = t("Choix automatique dans {s} s", { s: left })); if (left-- <= 0) done(0); };
      const iv = setInterval(tick, 1000); tick();
      function done(i) { clearInterval(iv); closeCard(); res(ask.options[i]); }
      $("#card").querySelectorAll("[data-i]").forEach((b) => b.onclick = () => done(Number(b.dataset.i)));
    });
  }
  function askVote(ask) {
    return new Promise((res) => {
      Snd?.sfx("tension");
      let left = 30;
      showCard(`<div class="kicker">${t("19H · LE VOTE QUI SAUVE")}</div><h2>${t("Qui sauves-tu de la Cage du sursis ?")}</h2>
        <p>${t("Un seul candidat retourne dans l'arène avec une étoile. Les autres sont évacués par drone. Dans cette maquette, ton vote pèse un peu plus que celui d'un spectateur réel.")}</p>
        <div class="votes">${ask.ids.map((id) => `<button class="vote" data-id="${id}"><img src="${pic(id)}" alt="">${esc(nameOf(id))}<span class="q">« ${esc(field(info[id], "catchphrase"))} »</span></button>`).join("")}</div>
        <div class="row"><button class="btn" id="skip">${t("Laisser le public décider")}</button><span class="timer" id="tm"></span></div>`);
      const tick = () => { $("#tm") && ($("#tm").textContent = t("Fin du vote dans {s} s", { s: left })); if (left-- <= 0) done(null); };
      const iv = setInterval(tick, 1000); tick();
      function done(id) { clearInterval(iv); closeCard(); res(id); }
      $("#card").querySelectorAll("[data-id]").forEach((b) => b.onclick = () => done(b.dataset.id));
      $("#skip").onclick = () => done(null);
    });
  }
  function showVoteResult(e) {
    return new Promise((res) => {
      showCard(`<div class="kicker">${t("RÉSULTAT DU VOTE")}</div><h2>${t("{a} est sauvé·e !", { a: esc(nameOf(e.saved)) })}</h2>
        <div class="votes" style="margin-top:12px">${e.result.map((r) => `<div class="vote" style="${r.id === e.saved ? "border-color:var(--safe)" : ""}"><img src="${pic(r.id)}" alt="">${esc(nameOf(r.id))}<div class="bar"><i style="width:${r.pct}%"></i></div><span class="q">${r.pct} %</span></div>`).join("")}</div>
        <div class="row"><button class="btn primary" id="ok">${t("Continuer")}</button></div>`);
      const go = () => { closeCard(); res(); };
      $("#ok").onclick = go; setTimeout(() => { if (!$("#over").hidden && $("#ok")) go(); }, 7000);
    });
  }
  function showNight(d, out) {
    return new Promise((res) => {
      const gone = out.map((id) => `<div class="cand"><img src="${pic(id)}" alt=""><span class="n">${esc(nameOf(id))}</span></div>`).join("");
      showCard(`<div class="kicker">${t("LA QUOTIDIENNE · JOUR {d}", { d })}</div><h2>${t("La nuit tombe sur l'arène")}</h2>
        <p>${out.length ? t("Évacués ce soir :") : t("Personne n'a quitté l'arène ce soir.")}</p><div class="grid">${gone}</div>
        <p>${t("{n} candidats encore en lice. Demain, l'arène se resserre.", { n: game.snapshot().cast.filter((c) => c.state !== "out").length })}</p>
        <div class="row"><button class="btn primary" id="ok">${t("Jour suivant")}</button></div>`);
      const go = () => { closeCard(); res(); };
      $("#ok").onclick = go; setTimeout(() => { if (!$("#over").hidden && $("#ok")) go(); }, 9000);
    });
  }
  function showWinner() {
    const snap = game.snapshot();
    const top = [...snap.cast].sort((a, b) => (a.rank || 99) - (b.rank || 99)).slice(0, 3);
    const order = [top[1], top[0], top[2]].filter(Boolean);
    const mine = me ? snap.cast.find((c) => c.id === me) : null;
    const best = [...snap.cast].sort((a, b) => b.stats.hits - a.stats.hits)[0];
    showCard(`<div class="kicker">${t("LE PRIME · FINALE")}</div><h2>${t("{a} remporte The Last - Arena Battle !", { a: esc(nameOf(snap.winner)) })}</h2>
      <div class="podium">${order.map((c) => `<div class="${c.rank === 1 ? "p1" : ""}"><img src="${pic(c.id)}" alt=""><div class="pl">${c.rank}</div>${esc(c.name)}</div>`).join("")}</div>
      <p>${t("Ce que gagne le vainqueur : une aura dorée visible dans toutes les émissions, et une nouvelle compétence pour sa carrière.")}</p>
      <p>${t("Le plus redoutable : {a}, avec {n} coups portés.", { a: esc(best.name), n: best.stats.hits })}</p>
      ${mine ? `<p>${mine.rank === 1 ? t("Ton favori a gagné ! Tu reçois le badge « Je l'avais dit ».") : t("Ton favori, {a}, finit {n}e.", { a: esc(mine.name), n: mine.rank })}</p>` : ""}
      <div class="row"><button class="btn primary" id="again">${t("Nouvelle saison")}</button><button class="btn" id="closeC">${t("Revoir l'arène")}</button></div>`, true);
    $("#again").onclick = () => { const u = new URL(location.href); u.searchParams.set("graine", seed + 1); u.searchParams.set("arene", ARENA_LIST[(ARENA_LIST.indexOf(arenaId) + 1) % ARENA_LIST.length]); location.href = u.toString(); };
    $("#closeC").onclick = closeCard;
  }

  // ---------- contrôles ----------
  document.querySelectorAll("[data-speed]").forEach((b) => b.onclick = () => {
    speed = Number(b.dataset.speed); world.setSpeed(speed);
    document.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  });
  $("#pause").onclick = () => { paused = !paused; world.setPaused(paused); $("#pause").setAttribute("aria-pressed", paused); $("#pause").textContent = paused ? "▶" : "❚❚"; };
  function setCam(m) { world.setMode(m); document.querySelectorAll("[data-cam]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.cam === m)); }
  document.querySelectorAll("[data-cam]").forEach((b) => b.onclick = () => setCam(b.dataset.cam));
  const updSound = () => { $("#sound").textContent = Snd?.muted ? "🔇" : "🔊"; };
  $("#sound").onclick = () => { Snd?.setMuted(!Snd.muted); updSound(); };
  updSound();

  // ---------- la saison ----------
  renderSide();
  await openCasting();
  const evacuatedToday = [];
  async function playAll(events) {
    for (const e of events) {
      if (e.type === "night") {
        world.setHour(e.day, 22);
        Snd?.setNight?.(true);
        log(e); renderSide();
        await showNight(e.day, evacuatedToday.splice(0));
        Snd?.setNight?.(false);
        continue;
      }
      if (e.type === "vote") { log(e); await showVoteResult(e); await world.play(e); renderSide(); continue; }
      if (e.type === "out") evacuatedToday.push(e.v);
      if (e.type === "danger" && e.v === me) e.quiet = false;
      log(e);
      if (e.type === "win") { renderSide(); await world.play(e); showWinner(); continue; }
      await world.play(e);
      renderSide();
    }
  }
  let step;
  while ((step = game.next())) {
    world.setHour(step.day, step.hour);
    world.setScreen(t("JOUR {d} · {h}", { d: step.day, h: hh(step.hour) }), t("{n} EN LICE", { n: game.snapshot().cast.filter((c) => c.state !== "out").length }));
    const snap = game.snapshot();
    world.sync(snap); world.syncTraps(snap.traps); world.setClosed(snap.closed);
    renderSide();
    await playAll(step.events);
    if (step.ask) {
      const value = step.ask.kind === "duel" ? await askDuel(step.ask) : await askVote(step.ask);
      await playAll(game.answer(value));
    }
    renderSide();
    await world.wait(step.events.length ? 0.8 : 1.4);
  }
})();
</script>
</html>
