<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last · Chasse au trésor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Concept : une expédition dans la jungle, carnet de bord et pierre de jade. Un seul thème sombre, assumé, comme un plateau télé.
   La vallée occupe tout l'écran ; le direct, les candidats et la carte sont dans un panneau (à droite sur grand écran, en bas sur mobile). */
:root {
  --ink: #0b1410;
  --deep: #12201a;
  --raise: #1a2d24;
  --line: #29443a;
  --text: #f3ead0;
  --mist: #a7beb1;
  --gold: #ffd166;
  --torch: #ff8a3d;
  --jade: #4fd1a1;
  --danger: #ff6b5b;
  --curse: #b58cff;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: .04em; }

.app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 390px; grid-template-rows: auto 1fr; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-left)); padding-top: max(10px, env(safe-area-inset-top)); background: var(--deep); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 3; }
.logo { font-family: var(--display); font-weight: 700; letter-spacing: .16em; font-size: 17px; white-space: nowrap; }
.logo b { color: var(--gold); }
.clock { font-family: var(--display); font-weight: 600; font-size: 15px; padding: 4px 10px; border-radius: 8px; background: var(--raise); white-space: nowrap; }
.count { color: var(--mist); font-size: 14px; white-space: nowrap; }
.count b { color: var(--text); font-family: var(--display); font-size: 16px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .12em; color: var(--danger); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.spacer { flex: 1; }
.ctrl { display: flex; gap: 4px; background: var(--raise); padding: 3px; border-radius: 10px; }
.ctrl button { min-width: 40px; height: 34px; border-radius: 8px; font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--mist); }
.ctrl button[aria-pressed="true"] { background: var(--gold); color: #1a1406; }
.icon-btn { height: 40px; min-width: 40px; border-radius: 10px; background: var(--raise); font-family: var(--display); font-weight: 600; }

.stage { position: relative; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.a3-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.a3-tag { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(11, 20, 16, .8); white-space: nowrap; }
.a3-tag.is-me { background: var(--gold); color: #1a1406; }
.a3-pop { position: absolute; left: 0; top: 0; font-family: var(--display); font-weight: 700; font-size: 22px; white-space: nowrap; color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.6); animation: popin .25s ease-out; }
.a3-pop.is-hit { color: var(--gold); font-size: 26px; }
.a3-pop.is-betray { color: var(--curse); font-size: 26px; }
.a3-pop.is-ko { color: var(--danger); font-size: 24px; }
.a3-pop.is-stars { color: var(--gold); font-size: 20px; letter-spacing: .06em; }
.a3-pop.is-item, .a3-pop.is-gift { font-size: 26px; }
.a3-pop.is-gift { color: var(--jade); }
@keyframes popin { from { scale: .3; } to { scale: 1; } }

.banner { position: absolute; left: 50%; top: 16px; translate: -50% 0; max-width: min(640px, calc(100% - 32px)); padding: 10px 16px; border-radius: 12px; background: rgba(11, 20, 16, .88); border: 1px solid var(--line); font-size: 14px; text-align: center; pointer-events: none; }
.cam { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 4px; background: rgba(11, 20, 16, .88); padding: 3px; border-radius: 10px; }
.cam button { padding: 0 12px; height: 34px; border-radius: 8px; font-size: 13px; color: var(--mist); }
.cam button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
.riddleBtn { position: absolute; right: 16px; bottom: 16px; height: 48px; padding: 0 18px; border-radius: 14px; background: var(--gold); color: #1a1406; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .04em; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.riddleBtn.is-new { animation: pulse 1.4s infinite; }
.riddleBtn.is-done { background: var(--raise); color: var(--mist); box-shadow: none; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--gold) 30%, transparent); } }

/* Panneau */
.side { background: var(--deep); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.fav { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.fav img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--raise); }
.fav h3 { font-size: 17px; }
.fav .meta { color: var(--mist); font-size: 13px; }
.state { font-size: 12px; font-family: var(--display); font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--raise); }
.state.risk { background: color-mix(in srgb, var(--danger) 25%, transparent); color: #ffc9c2; }
.state.out { background: #2a2a2a; color: var(--mist); }
.state.win { background: var(--gold); color: #1a1406; }
.fav .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--raise); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--gold); color: #1a1406; }
.btn:disabled { opacity: .45; cursor: default; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; height: 44px; font-family: var(--display); font-weight: 600; color: var(--mist); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--gold); }
.pane { flex: 1; overflow-y: auto; min-height: 0; padding: 8px 16px 24px; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 8px; }
.feed li { padding: 8px 10px; border-radius: 10px; background: var(--raise); font-size: 14px; animation: slidein .3s ease-out; }
.feed li .when { color: var(--mist); font-size: 12px; font-family: var(--display); margin-right: 6px; }
.feed li.hot { border-left: 3px solid var(--danger); }
.feed li.good { border-left: 3px solid var(--jade); }
.feed li.gold { border-left: 3px solid var(--gold); }
.feed li.curse { border-left: 3px solid var(--curse); }
.feed li .voice { display: block; margin-top: 4px; color: var(--mist); font-style: italic; font-size: 13px; }
.feed li .voice b { font-style: normal; color: var(--torch); font-family: var(--display); }
@keyframes slidein { from { opacity: 0; translate: 0 -6px; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.cand { position: relative; text-align: center; font-size: 12px; padding: 4px; border-radius: 10px; }
.cand img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--raise); display: block; }
.cand .n { font-weight: 600; display: block; margin-top: 2px; }
.cand .s { font-size: 11px; color: var(--mist); }
.cand.is-risk img { outline: 2px solid var(--danger); }
.cand.is-out { opacity: .38; }
.cand.is-out img { filter: grayscale(1); }
.cand.is-me { background: color-mix(in srgb, var(--gold) 18%, transparent); }
.cand .rk { position: absolute; top: 8px; left: 8px; font-family: var(--display); font-size: 11px; background: rgba(0,0,0,.7); padding: 0 5px; border-radius: 5px; }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 8px; }
.piece { border-radius: 12px; background: var(--raise); padding: 8px; text-align: center; font-size: 12px; border: 1px solid var(--line); }
.piece .no { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: 15px; }
.piece img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; display: block; margin: 4px auto; }
.piece .q { width: 56px; height: 56px; border-radius: 10px; margin: 4px auto; display: grid; place-items: center; background: var(--deep); font-size: 24px; color: var(--mist); }
.piece.cursed { border-color: var(--curse); }
.note { color: var(--mist); font-size: 13px; margin: 8px 0; }

/* Fenêtres par-dessus */
.over { position: fixed; inset: 0; z-index: 10; background: rgba(6, 10, 8, .86); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px 16px; overflow-y: auto; }
.card { width: min(860px, 100%); background: var(--deep); border: 1px solid var(--line); border-radius: 18px; padding: 24px; max-height: 100%; overflow-y: auto; }
.card h2 { font-size: clamp(22px, 4vw, 32px); }
.card .kicker { font-family: var(--display); color: var(--gold); letter-spacing: .14em; font-size: 13px; font-weight: 600; }
.card p { color: var(--mist); margin: 8px 0 16px; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--mist); margin-bottom: 10px; }
.badge { font-family: var(--display); font-size: 10px; font-weight: 600; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; position: absolute; bottom: 30px; left: 50%; translate: -50% 0; white-space: nowrap; }
.badge.pub { background: var(--torch); color: #1a1406; }
.badge.prod { background: #7fb0ff; color: #0b1428; }
.legend .badge { position: static; translate: none; }
.pick .cand { cursor: pointer; }
.pick .cand[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 30%, transparent); }
.votes { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.vote { padding: 10px; border-radius: 14px; background: var(--raise); text-align: center; border: 2px solid transparent; }
.vote:hover { border-color: var(--jade); }
.vote img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 6px; }
.vote .q { font-size: 12px; color: var(--mist); display: block; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--jade); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; text-align: center; margin: 12px 0; }
.podium img { width: 100%; max-width: 140px; aspect-ratio: 1; border-radius: 14px; object-fit: cover; }
.podium .p1 img { outline: 3px solid var(--gold); }
.podium .pl { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--gold); }
.timer { font-family: var(--display); color: var(--mist); font-size: 13px; }

/* L'énigme */
.puzzle { background: #0e1a15; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; text-align: center; }
.puzzle .ask { font-family: var(--display); font-size: 17px; margin-bottom: 12px; }
.glyphs { font-size: clamp(30px, 7vw, 44px); letter-spacing: .15em; line-height: 1.3; }
.glyphs .qm { display: inline-block; min-width: 1.2em; border-radius: 10px; background: var(--raise); color: var(--gold); font-family: var(--display); }
.pgrid { display: inline-grid; gap: 4px; font-size: clamp(18px, 4.6vw, 26px); }
.pgrid span { width: 1.7em; height: 1.7em; display: grid; place-items: center; background: var(--raise); border-radius: 8px; }
.pgrid span.star { background: var(--gold); }
.moves { font-size: 28px; letter-spacing: .3em; margin-top: 10px; font-weight: 700; color: var(--gold); }
.eq { font-size: clamp(24px, 6vw, 34px); line-height: 1.6; font-family: var(--display); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.opt { min-height: 64px; border-radius: 14px; background: var(--raise); font-size: 28px; border: 2px solid transparent; font-family: var(--display); font-weight: 700; }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt.is-ok { border-color: var(--jade); background: color-mix(in srgb, var(--jade) 22%, var(--raise)); }
.opt.is-ko { border-color: var(--danger); opacity: .6; }
.hints { text-align: left; margin-top: 10px; }
.hints div { font-size: 13px; color: var(--mist); padding: 6px 10px; border-radius: 8px; background: var(--raise); margin-top: 6px; }
.msg { font-weight: 600; margin-top: 10px; min-height: 1.4em; }
.msg.ok { color: var(--jade); }
.msg.ko { color: var(--danger); }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 44vh; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .fav { grid-template-columns: 48px 1fr; padding: 10px 16px; }
  .fav img { width: 48px; height: 48px; }
  .count .lbl, .live { display: none; }
  .top { gap: 6px; }
  .logo { font-size: 13px; letter-spacing: .1em; flex-basis: 100%; }
  .ctrl button { min-width: 34px; }
  .icon-btn { height: 40px; min-width: 38px; }
  .card { padding: 18px; }
  .cam { bottom: 10px; left: 10px; }
  .cam button { padding: 0 9px; }
  .riddleBtn { right: 10px; bottom: 56px; height: 44px; }
}
</style>

<div class="app">
  <header class="top">
    <span class="logo">THE LAST · <b data-i18n>CHASSE AU TRÉSOR</b></span>
    <span class="live" data-i18n>EN DIRECT</span>
    <span class="clock" id="clock">J1 · 08h</span>
    <span class="count"><b id="alive">24</b> <span class="lbl" data-i18n>en lice</span></span>
    <span class="spacer"></span>
    <div class="ctrl" role="group" aria-label="Vitesse" data-i18n-attr="aria-label">
      <button id="pause" aria-pressed="false" title="Pause" data-i18n-attr="title,aria-label" aria-label="Pause">❚❚</button>
      <button data-speed="1" aria-pressed="true">×1</button>
      <button data-speed="3" aria-pressed="false">×3</button>
      <button data-speed="8" aria-pressed="false">×8</button>
    </div>
    <button class="icon-btn" id="sound" title="Son" aria-label="Son" data-i18n-attr="title,aria-label">🔊</button>
    <button class="icon-btn" data-lang-switch></button>
  </header>

  <main class="stage">
    <canvas id="c"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="cam" role="group" aria-label="Caméra" data-i18n-attr="aria-label">
      <button data-cam="director" aria-pressed="true" data-i18n>Réalisateur</button>
      <button data-cam="follow" aria-pressed="false" data-i18n>Mon favori</button>
      <button data-cam="wide" aria-pressed="false" data-i18n>Vue large</button>
    </div>
    <button class="riddleBtn" id="riddleBtn">🧩 <span id="riddleLbl"></span></button>
  </main>

  <aside class="side">
    <div class="fav" id="fav"></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="feed" data-i18n>Le direct</button>
      <button role="tab" aria-selected="false" data-tab="cast" data-i18n>Les 24</button>
      <button role="tab" aria-selected="false" data-tab="map" data-i18n>La carte</button>
    </div>
    <div class="pane" id="paneFeed"><ol class="feed" id="feed"></ol></div>
    <div class="pane" id="paneCast" hidden><div class="grid" id="grid"></div></div>
    <div class="pane" id="paneMap" hidden><div id="map"></div></div>
  </aside>
</div>

<div class="over" id="over" hidden><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="i18n.js"></script>
<script src="i18n-en-tresor.js"></script>
<script src="sound.js"></script>
<script src="avatar.js"></script>
<script src="tresor-engine.js"></script>
<script src="tresor3d.js"></script>
<script>
(async function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const L = I18N.lang;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const pic = (id) => `img/p/${id}.webp`;
  const seed = Number(new URLSearchParams(location.search).get("graine")) || 7;

  // le vivier : fiches (carrière) + fiches visuelles (modèle 3D)
  const [pool, looks] = await Promise.all([fetch("personnages.json").then((r) => r.json()), fetch("casting.json").then((r) => r.json())]);
  const lookOf = Object.fromEntries(looks.map((c) => [c.id, c.look]));
  const cast = TresorEngine.cast(pool.map((c) => ({ ...c, look: lookOf[c.id] })), seed);
  const game = TresorEngine.create(cast, seed);
  const info = Object.fromEntries(cast.map((c) => [c.id, c]));
  const nameOf = (id) => info[id]?.name || id;
  const field = (c, k) => (L === "en" && c.en?.[k]) || c[k];
  const SKILL = { negotiation: t("négociation"), firstAid: t("premiers secours"), tracking: t("pistage"), stealth: t("discrétion"), orientation: t("orientation"), crafting: t("bricolage"), climbing: t("escalade"), swimming: t("natation"), endurance: t("endurance"), foraging: t("cueillette") };

  const Snd = window.TheLastSound;
  const world = Tresor3D.init($("#c"), cast, {
    sfx: (n) => Snd?.sfx(n),
    onPick: (id) => openCand(id),
    piecesOf: (id) => game.byId[id]?.pieces.length || 0,
  });
  world.setHour(1, 8);

  // ---------- état de l'interface ----------
  let me = null, speed = 1, paused = false;
  const puz = { day: 0, tries: 0, done: false, solvedDays: [], whispered: [] };

  // ---------- les commentateurs ----------
  const VOICES = {
    piece: [t("Un morceau de plus ! La carte se reconstitue."), t("Celui-là, tout le monde va le vouloir.")],
    trap: [t("La jungle ne pardonne rien… mais elle a de l'humour."), t("Ça, c'est le genre d'image qu'on repassera au prime !")],
    steal: [t("Pas vu, pas pris ! Enfin… nous, on a tout vu."), t("Dans cette vallée, on dort d'un œil.")],
    toucan: [t("Le public a parlé, et le toucan a bien transmis !"), t("Les spectateurs plus rapides que les candidats. Encore !")],
    curse: [t("Ce morceau porte vraiment malheur."), t("Je ne voudrais pas être à sa place.")],
    out: [t("Au revoir, et merci pour l'aventure."), t("Le drone l'emmène loin de la vallée.")],
    pact: [t("Un pacte… pour combien de temps ?"), t("Ensemble, ils iront plus loin. En théorie.")],
    win: [t("Quelle saison ! Le trésor d'Itzaluna a trouvé son maître.")],
  };
  const CASTERS = ["Paz", "Tito"];
  let castTurn = 0;
  function voice(type) {
    const L2 = VOICES[type];
    if (!L2 || Math.random() < 0.4) return "";
    castTurn++;
    return `<span class="voice"><b>${CASTERS[castTurn % 2]}</b> · ${esc(L2[Math.floor(Math.random() * L2.length)])}</span>`;
  }
  const hh = (h) => (L === "en" ? `${h % 12 || 12} ${h < 12 ? "AM" : "PM"}` : String(h).padStart(2, "0") + "h");
  function log(e) {
    if (e.type === "riddle") return;
    const cls = { out: "hot", trap: "", vote: "good", toucan: "good", medal: "good", piece: "gold", win: "gold", finale: "gold", lock: "gold", zone: "gold", guardian: "hot", steal: "curse", curse: "curse", fake: "hot" }[e.type] || "";
    const li = document.createElement("li");
    li.className = cls;
    li.innerHTML = `<span class="when">${t("J{d}", { d: e.day })} · ${hh(e.hour)}</span>${esc(e.text)}${voice(e.cause === "finale" ? "" : e.type)}`;
    $("#feed").appendChild(li);
    while ($("#feed").children.length > 140) $("#feed").firstChild.remove();
    if (me && (e.a === me || e.v === me || e.ids?.includes(me)) && e.type !== "night") banner(e.text);
  }
  let bannerT = 0;
  function banner(text) {
    const b = $("#banner"); b.textContent = text; b.hidden = false;
    clearTimeout(bannerT); bannerT = setTimeout(() => (b.hidden = true), 4500);
  }

  // ---------- panneau ----------
  const snapC = (id) => game.snapshot().cast.find((x) => x.id === id);
  function stateLabel(c) {
    const snap = game.snapshot();
    if (c.id === snap.winner) return `<span class="state win">${t("Vainqueur")}</span>`;
    if (c.state === "out") return `<span class="state out">${t("Évacué·e · {n}e", { n: c.rank })}</span>`;
    if (snap.threatened.includes(c.id) && snap.hour >= 19) return `<span class="state risk">${t("Menacé·e")}</span>`;
    return "";
  }

    if (step.ask) {
      const value = await askVote(step.ask);
      await playAll(game.answer(value));
    }
    while (cardOpen) await new Promise((r) => setTimeout(r, 200));
    await world.wait(step.events.length ? 0.9 : 1.6);
  }
})();
</script>
